version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # wgpu, winit and egui move together and must stay compatible; updating
      # one at a time produces pull requests that cannot compile.
      graphics-stack:
        patterns:
          - "wgpu*"
          - "winit"
          - "egui*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # This action's tags are Rust versions, not action releases, so a bump
      # here means "use a different compiler" — and Dependabot has no idea
      # which ones exist. It once proposed Rust 1.100.0. The MSRV job now
      # passes the version as an input read from Cargo.toml, so nothing should
      # reference a version tag; this is the belt to that pair of braces.
      - dependency-name: dtolnay/rust-toolchain
